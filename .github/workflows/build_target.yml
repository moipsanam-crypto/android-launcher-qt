
name: Build Volla Launcher

on:
  push:
    branches:
      - master
    tags:
      - '*'
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build APK
        env:
          ANDROID_KEYSTORE_FILE_CONTENTS: ${{ secrets.ANDROID_KEYSTORE_FILE_CONTENTS }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            -e ANDROID_KEYSTORE_FILE_CONTENTS \
            -e ANDROID_KEYSTORE_PASS \
            -e ANDROID_KEYSTORE_ALIAS \
            a12e/docker-qt:5.13-android_arm64_v8a \
            bash -lc '
              set -e

              git config --global --add safe.directory /workspace

              export CACHE_DIR=build/cache
              export M2_HOME=$(realpath -m "$CACHE_DIR/.m2")
              export MAVEN_HOME=$(realpath -m "$CACHE_DIR/.m2")
              export GRADLE_USER_HOME=$(realpath -m "$CACHE_DIR/.gradle")

              export VERSION=$(git describe --tags || git rev-parse --short HEAD)
              export TIMESTAMP=$(date +%Y%m%d%H%M)
              export BUILD_ID="$VERSION-$TIMESTAMP"

              mkdir -p "$MAVEN_HOME"
              mkdir -p "$GRADLE_USER_HOME"
              mkdir -p releases

              ./build_package_android ./releases

              chmod -R 755 ./releases
            '

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Volla-Launcher-APK
          path: releases/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Build Changelog
        id: github_release
        uses: mikepenz/release-changelog-builder-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v0.1.14
        with:
          body: ${{ steps.github_release.outputs.changelog }}
